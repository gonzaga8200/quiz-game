name: Deploy to Firebase

# Production deploy: the static site (Hosting) and then the Firestore security rules.
# Runs when a release is published, when release-please creates one
# (it calls this workflow directly: releases created with the default GITHUB_TOKEN do not
# trigger `release` events), and on demand.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to deploy
        type: string
        required: false
  release:
    types: [published]
  workflow_dispatch:

# Never run two production deploys at once; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://contrarreloj-quiz.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # NUXT_PUBLIC_* values are public identifiers baked into the static build.
      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NUXT_PUBLIC_FIREBASE_API_KEY }}
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NUXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_APP_ID }}
          NUXT_PUBLIC_GA_ID: ${{ vars.NUXT_PUBLIC_GA_ID }}
          # Public origin for canonical URLs, the sitemap and social cards. Leave the variable
          # unset to use the default (see app/content/seo.ts); set it once there is a custom domain.
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}

      - name: Deploy to the live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTRARRELOJ_QUIZ }}
          projectId: contrarreloj-quiz
          channelId: live

  # The security rules are not part of the Hosting deploy. Before this job existed they were
  # published by hand, and the web shipped a ranking feature while the published rules still
  # rejected it. It runs after Hosting on purpose: if the service account lacks permission to
  # publish rules (it needs the "Firebase Rules Admin" role) the site is still deployed and
  # this job fails loudly instead of blocking the release.
  rules:
    name: firestore rules
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Publish the rules and check they are the ones in the repository
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTRARRELOJ_QUIZ }}
        run: |
          key="$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          npx firebase deploy --only firestore:rules --project contrarreloj-quiz
          npm run rules:check -- --project contrarreloj-quiz
