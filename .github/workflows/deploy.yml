name: Deploy to Firebase Hosting

# Production deploy. Runs when a release is published, when release-please creates one
# (it calls this workflow directly: releases created with the default GITHUB_TOKEN do not
# trigger `release` events), and on demand.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to deploy
        type: string
        required: false
  release:
    types: [published]
  workflow_dispatch:

# Never run two production deploys at once; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://contrarreloj-quiz.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # NUXT_PUBLIC_* values are public identifiers baked into the static build.
      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NUXT_PUBLIC_FIREBASE_API_KEY }}
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NUXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_APP_ID }}
          NUXT_PUBLIC_GA_ID: ${{ vars.NUXT_PUBLIC_GA_ID }}
          # Public origin for canonical URLs, the sitemap and social cards. Leave the variable
          # unset to use the default (see app/content/seo.ts); set it once there is a custom domain.
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}

      - name: Deploy to the live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTRARRELOJ_QUIZ }}
          projectId: contrarreloj-quiz
          channelId: live
