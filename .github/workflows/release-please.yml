name: Release

# Conventional Commits on main -> release-please keeps a "release PR" up to date with the
# next version and CHANGELOG. Merging that PR creates the tag and the GitHub Release, and
# this workflow then deploys that exact tag to Firebase Hosting.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # PRs opened with the default GITHUB_TOKEN do not trigger the CI workflow, and `main`
      # requires the `ci` check. Running CI on the release branch by hand supplies it.
      - name: Run CI on the release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.prs)[0].headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: read
